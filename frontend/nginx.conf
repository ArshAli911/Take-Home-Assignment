server {
    listen 80;
    server_name _;

    # Allow uploads up to the backend's 100 MB cap (plus a small margin
    # for multipart overhead).
    client_max_body_size 110M;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the FastAPI service. The trailing slash on
    # `proxy_pass` strips the `/api/` prefix before forwarding.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback: any unmatched path renders the React index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
